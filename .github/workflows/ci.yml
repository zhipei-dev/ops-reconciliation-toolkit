name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '24' }
      - run: dotnet restore OpsReconciliation.sln
      - run: dotnet build OpsReconciliation.sln -c Release --no-restore
      - run: dotnet test tests/OpsReconciliation.Tests/OpsReconciliation.Tests.csproj -c Release --no-build
      - name: Scan NuGet packages for known vulnerabilities
        run: |
          dotnet package list --project src/OpsReconciliation.Core/OpsReconciliation.Core.csproj --vulnerable --include-transitive
          dotnet package list --project src/OpsReconciliation.Api/OpsReconciliation.Api.csproj --vulnerable --include-transitive
          dotnet package list --project tests/OpsReconciliation.Tests/OpsReconciliation.Tests.csproj --vulnerable --include-transitive
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
